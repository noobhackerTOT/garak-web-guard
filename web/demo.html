<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="console-token" content="__CONSOLE_TOKEN__"><title>Web Guard · 本地模拟聊天网页</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif;background:#f3f6ee;color:#2b4934}main{max-width:900px;margin:35px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:25px}small{color:#899976}.note{background:#e5efdb;border:1px solid #d6e4c7;padding:15px;border-radius:10px;font-size:12px}.mode{font-size:11px;color:#97a884}#messages{min-height:260px;padding:25px 0}.message{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px 20px;border-radius:12px;margin:14px 0;max-width:85%;font-size:13px}.user-message{background:#ddecce;margin-left:auto}.assistant-message{background:white;border:1px solid #e0e9d8}form{display:flex;gap:10px;align-items:stretch}textarea{flex:1;min-height:85px;resize:vertical;border:1px solid #cdddbf;border-radius:10px;padding:14px;font:13px system-ui}button{border:0;background:#335c3b;color:white;border-radius:8px;padding:10px 17px;cursor:pointer;font:13px system-ui}button:disabled{opacity:.5;cursor:wait}#new-chat{background:#e0ebd3;color:#608046}#stop-button{background:#bf8b59}footer{font-size:10px;color:#92a17f;margin:20px 0}</style>
<main><header><h1>模拟聊天网页 <small> / demo</small></h1><button id="new-chat">新建对话</button></header><div class="note">此页面是本地测试夹具，不是真实 AI。用于验证浏览器输入、流式回答读取、garak 探针与报告流程。<div id="mode" class="mode"></div></div><section id="messages" aria-live="polite"></section><form id="chat-form"><textarea id="chat-input" placeholder="发送一条测试消息" aria-label="消息"></textarea><button id="send-button" type="submit">发送</button><button id="stop-button" type="button" hidden>停止生成</button></form><footer>输入框 #chat-input · 回答 .assistant-message · 发送 #send-button · 新对话 #new-chat</footer></main>
<script>
const byId=id=>document.getElementById(id), vulnerable=new URLSearchParams(location.search).get('vulnerable')==='1';
byId('mode').textContent=vulnerable?'当前模式：故意输出探针标记。加 ?vulnerable=0 可切换拒绝模式。':'当前模式：拒绝指令覆盖。';
let generation=0;
function message(cls,text){const el=document.createElement('div');el.className='message '+cls;el.textContent=text;byId('messages').appendChild(el);return el;}
byId('new-chat').onclick=()=>{generation++;byId('messages').replaceChildren();byId('chat-input').value='';byId('send-button').disabled=false;byId('stop-button').hidden=true;};
byId('stop-button').onclick=()=>{generation++;byId('stop-button').hidden=true;byId('send-button').disabled=false;};
byId('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();byId('chat-form').requestSubmit();}});
byId('chat-form').onsubmit=async e=>{e.preventDefault();const prompt=byId('chat-input').value;if(!prompt.trim()||byId('send-button').disabled)return;const current=++generation;message('user-message',prompt);byId('chat-input').value='';byId('send-button').disabled=true;byId('stop-button').hidden=false;const reply=message('assistant-message','');try{const response=await fetch('/api/demo-reply',{method:'POST',headers:{'Content-Type':'application/json','X-Console-Token':document.querySelector('meta[name="console-token"]').content},body:JSON.stringify({prompt,vulnerable})});const data=await response.json();if(!response.ok)throw new Error(data.error);for(let i=0;i<data.response.length;i+=7){if(current!==generation)return;reply.textContent=data.response.slice(0,i+7);await new Promise(r=>setTimeout(r,45));}}catch(err){reply.textContent='连接错误：'+err.message;}finally{if(current===generation){byId('send-button').disabled=false;byId('stop-button').hidden=true;}}};
</script></html>
