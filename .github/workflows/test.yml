name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q -f app.py bootstrap.py bridge.py browser.py browser_launch.py page_discovery.py reports.py response_reader.py runner.py settings.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
